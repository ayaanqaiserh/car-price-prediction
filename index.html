<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Price Prediction</title>
</head>
<body>
  <h1>Car Price Prediction</h1>
  <p>Pick an algorithm, enter the car details, and click the button.</p>

  <h2>Predict selling price</h2>
  <form id="regression-form">
    <label>Algorithm:
      <select name="algorithm">
        <option value="random_forest">Random Forest</option>
        <option value="linear_regression">Linear Regression</option>
        <option value="decision_tree">Decision Tree</option>
        <option value="svm">SVM</option>
      </select>
    </label><br>
    <label>Year: <input name="Year" type="number" value="2014" required></label><br>
    <label>Present price: <input name="Present_Price" type="number" step="any" value="5.59" required></label><br>
    <label>Kilometers driven: <input name="Kms_Driven" type="number" value="27000" required></label><br>
    <label>Fuel type:
      <select name="Fuel_Type">
        <option>Petrol</option><option>Diesel</option><option>CNG</option>
      </select>
    </label><br>
    <label>Seller type:
      <select name="Seller_Type">
        <option>Dealer</option><option>Individual</option>
      </select>
    </label><br>
    <label>Transmission:
      <select name="Transmission">
        <option>Manual</option><option>Automatic</option>
      </select>
    </label><br>
    <label>Previous owners: <input name="Owner" type="number" value="0" required></label><br>
    <button type="submit">Predict selling price</button>
  </form>
  <p id="regression-result"></p>

  <h2>Predict price category</h2>
  <form id="classification-form">
    <label>Algorithm:
      <select name="algorithm">
        <option value="random_forest">Random Forest</option>
        <option value="decision_tree">Decision Tree</option>
        <option value="svm">SVM</option>
        <option value="naive_bayes">Naive Bayes</option>
      </select>
    </label><br>
    <label>Year: <input name="Year" type="number" value="2014" required></label><br>
    <label>Present price: <input name="Present_Price" type="number" step="any" value="5.59" required></label><br>
    <label>Kilometers driven: <input name="Kms_Driven" type="number" value="27000" required></label><br>
    <label>Fuel type:
      <select name="Fuel_Type">
        <option>Petrol</option><option>Diesel</option><option>CNG</option>
      </select>
    </label><br>
    <label>Seller type:
      <select name="Seller_Type">
        <option>Dealer</option><option>Individual</option>
      </select>
    </label><br>
    <label>Transmission:
      <select name="Transmission">
        <option>Manual</option><option>Automatic</option>
      </select>
    </label><br>
    <label>Previous owners: <input name="Owner" type="number" value="0" required></label><br>
    <button type="submit">Predict price category</button>
  </form>
  <p id="classification-result"></p>

  <script>
    function formDataToCar(form) {
      const values = new FormData(form);
      return {
        Year: Number(values.get("Year")),
        Present_Price: Number(values.get("Present_Price")),
        Kms_Driven: Number(values.get("Kms_Driven")),
        Fuel_Type: values.get("Fuel_Type"),
        Seller_Type: values.get("Seller_Type"),
        Transmission: values.get("Transmission"),
        Owner: Number(values.get("Owner")),
        algorithm: values.get("algorithm")
      };
    }

    function sendPrediction(formId, endpoint, resultId, resultKey, label) {
      const form = document.getElementById(formId);
      const result = document.getElementById(resultId);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "Calculating...";

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formDataToCar(form))
          });

          const data = await response.json();
          if (!response.ok) {
            const message = typeof data.detail === "string"
              ? data.detail
              : "Please check the values you entered.";
            throw new Error(message);
          }

          result.textContent = label + data[resultKey] + " (" + data.algorithm + ")";
        } catch (error) {
          result.textContent = "Error: " + error.message;
        }
      });
    }

    sendPrediction("regression-form", "/predict/regression",
      "regression-result", "predicted_selling_price", "Predicted selling price: ");

    sendPrediction("classification-form", "/predict/classification",
      "classification-result", "predicted_price_category", "Predicted price category: ");
  </script>
</body>
</html>
